    <ellipse cx="39" cy="114.8" rx="7.5" ry="3.6" fill="#2768AD" stroke="#1F5E9E" stroke-width="1.6" transform="rotate(0 39 114.8)"/>
    <polyline points="53.86,54.52 49.16,65.56 57.21,74.46" fill="none" stroke="#1F5E9E" stroke-width="9.2" stroke-linecap="round" stroke-linejoin="round"/>
