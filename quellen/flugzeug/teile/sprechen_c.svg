    <circle cx="57.21" cy="74.46" r="5" fill="#FFFFFF" stroke="#1F5E9E" stroke-width="1.6"/>
    <!-- Körper -->
    <g transform="translate(0 0) rotate(-1 42.4 85.4)">
    <polygon points="94.4,62 19.2,40.16 28.8,62" fill="none" stroke="#FFFFFF" stroke-width="6.6" stroke-linejoin="round" stroke-linecap="round" stroke-opacity="0.9"/>
    <polygon points="94.4,62 28.8,62 40,85.4" fill="none" stroke="#FFFFFF" stroke-width="6.6" stroke-linejoin="round" stroke-linecap="round" stroke-opacity="0.9"/>
    <polygon points="94.4,62 19.2,40.16 28.8,62" fill="none" stroke="#1D2320" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" stroke-opacity="1"/>
    <polygon points="94.4,62 28.8,62 40,85.4" fill="none" stroke="#1D2320" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" stroke-opacity="1"/>
    </g>
    <!-- vorne: Bein, dann der aufgesetzte Arm -->
    <polyline points="42.4,85.4 48.72,100.1 42.4,114.8" fill="none" stroke="#1F5E9E" stroke-width="9.2" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="42.4,85.4 48.72,100.1 42.4,114.8" fill="none" stroke="#2F7FD0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="45.4" cy="114.8" rx="7.5" ry="3.6" fill="#2F7FD0" stroke="#1F5E9E" stroke-width="1.6" transform="rotate(0 45.4 114.8)"/>
    <polyline points="61.9,56.46 71.65,63.45 77.84,53.18" fill="none" stroke="#1F5E9E" stroke-width="9.2" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="61.9,56.46 71.65,63.45 77.84,53.18" fill="none" stroke="#2F7FD0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="77.84" cy="53.18" r="5" fill="#FFFFFF" stroke="#1F5E9E" stroke-width="1.6"/>
