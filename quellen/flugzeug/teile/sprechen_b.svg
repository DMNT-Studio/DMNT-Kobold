    <polyline points="63.39,57.52 66.33,69.15 77.17,64" fill="none" stroke="#1F5E9E" stroke-width="9.2" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="63.39,57.52 66.33,69.15 77.17,64" fill="none" stroke="#2F7FD0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="77.17" cy="64" r="5" fill="#FFFFFF" stroke="#1F5E9E" stroke-width="1.6"/>
