    <polyline points="60.8,56.8 72.27,53.27 75.8,41.8" fill="none" stroke="#1F5E9E" stroke-width="9.2" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="60.8,56.8 72.27,53.27 75.8,41.8" fill="none" stroke="#2F7FD0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="75.8" cy="41.8" r="5" fill="#FFFFFF" stroke="#1F5E9E" stroke-width="1.6"/>
