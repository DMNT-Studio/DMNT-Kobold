    <ellipse cx="31" cy="114.8" rx="7.5" ry="3.6" fill="#2768AD" stroke="#1F5E9E" stroke-width="1.6" transform="rotate(0 31 114.8)"/>
    <polyline points="52.8,54.72 53.41,42.74 41.8,39.72" fill="none" stroke="#1F5E9E" stroke-width="9.2" stroke-linecap="round" stroke-linejoin="round"/>
