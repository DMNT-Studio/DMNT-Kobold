    <ellipse cx="39" cy="114.8" rx="7.5" ry="3.6" fill="#2768AD" stroke="#1F5E9E" stroke-width="1.6" transform="rotate(0 39 114.8)"/>
    <polyline points="52.23,53.96 48.12,65.23 56.62,73.7" fill="none" stroke="#1F5E9E" stroke-width="9.2" stroke-linecap="round" stroke-linejoin="round"/>
