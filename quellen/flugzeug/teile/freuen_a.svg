    <polyline points="62.4,56.8 71.07,48.5 68.4,36.8" fill="none" stroke="#1F5E9E" stroke-width="9.2" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="62.4,56.8 71.07,48.5 68.4,36.8" fill="none" stroke="#2F7FD0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="68.4" cy="36.8" r="5" fill="#FFFFFF" stroke="#1F5E9E" stroke-width="1.6"/>
