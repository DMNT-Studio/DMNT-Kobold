<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 110 120" width="110" height="120">
    <!-- hinten: Bein und Arm der abgewandten Seite -->
    <polyline points="36.03,83.73 39.84,99.27 36,114.8" fill="none" stroke="#1F5E9E" stroke-width="9.2" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="36.03,83.73 39.84,99.27 36,114.8" fill="none" stroke="#2768AD" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="39" cy="114.8" rx="7.5" ry="3.6" fill="#2768AD" stroke="#1F5E9E" stroke-width="1.6" transform="rotate(0 39 114.8)"/>
    <polyline points="54.93,54.93 49.85,65.81 57.58,74.98" fill="none" stroke="#1F5E9E" stroke-width="9.2" stroke-linecap="round" stroke-linejoin="round"/>
