name: Release

# Ein Tag v<version> (z. B. v0.7.0) baut Setup, Portable-ZIP und Prüfsummen und legt ein
# GitHub-Release an. Tags mit Bindestrich (v0.7.1-test.1) werden Vorab-Versionen und
# erreichen nur Kobolde im Testkanal (DMNT_KOBOLD_UPDATE_KANAL=test).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Tag passt zur Version
        shell: pwsh
        run: |
          $v = python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ("v$v" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} passt nicht zu Version $v in pyproject.toml"
          }

      - name: Abhängigkeiten
        run: python -m pip install -e .[dev] "pyinstaller>=6.16"

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -rf --junitxml=build/tests.xml

      - name: Fehler sichtbar machen
        if: failure()
        run: python packaging/ci_fehler.py build/tests.xml

      - name: Inno Setup
        run: choco install innosetup -y --no-progress

      # SIGNPATH: aktivieren nach Freigabe des Antrags (signpath.org/foundation).
      # Signiert werden muss DMNT-Kobold.exe (nach PyInstaller) und das Setup (nach Inno
      # Setup), jeweils vor den Prüfsummen. Dafür bauen.ps1 in zwei Schritte teilen.
      # - uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: <ORGANISATION>
      #     project-slug: dmnt-kobold
      #     signing-policy-slug: release-signing
      #     github-artifact-id: <ARTEFAKT>
      #     wait-for-completion: true

      - name: Bauen
        shell: pwsh
        run: ./packaging/bauen.ps1

      - name: Release-Text aus CHANGELOG.md
        run: python packaging/changelog_abschnitt.py "${{ github.ref_name }}" build/release_text.md

      - name: Release anlegen
        uses: softprops/action-gh-release@v2
        with:
          name: DMNT-Kobold ${{ github.ref_name }}
          body_path: build/release_text.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/DMNT-Kobold-Setup.exe
            dist/DMNT-Kobold-Portable.zip
            dist/SHA256SUMS.txt
