name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Abhängigkeiten
        run: python -m pip install -e .[dev,bauen]
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -rf --junitxml=build/tests.xml
      - name: Fehler sichtbar machen
        if: failure()
        run: python packaging/ci_fehler.py build/tests.xml
