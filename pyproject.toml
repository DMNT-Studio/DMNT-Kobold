[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmnt-kobold"
version = "0.4.0"
description = "Desktop-Begleiter für Windows: ein kleiner Kobold lebt auf deiner Taskleiste."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Stefan Rohrbach" }]
requires-python = ">=3.12"
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
bauen = ["pillow>=10", "numpy>=1.26", "scipy>=1.11"]

[project.gui-scripts]
dmnt-kobold = "dmnt_kobold.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dmnt_kobold = ["*.json", "avatare/*/*.json", "avatare/*/*.py", "avatare/*/*.txt", "avatare/*/*.png",
               "avatare/*/*.jpg", "avatare/*/frames/*/*.png", "avatare/*/toene/*.wav", "avatare/*/zubehoer/*.png",
               "zubehoer/*.png", "tricks/*/*.py", "tricks/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
