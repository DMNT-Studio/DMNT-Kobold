[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmnt-kobold"
version = "0.1.0"
description = "Desktop-Begleiter für Windows: ein kleiner Kobold lebt auf deiner Taskleiste."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Stefan Rohrbach" }]
requires-python = ">=3.12"
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.gui-scripts]
dmnt-kobold = "dmnt_kobold.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
